apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fulfillment-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fulfillment-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: http
